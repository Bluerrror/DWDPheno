name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dwdpheno
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Skip versions that are already on PyPI
        id: pypi
        run: |
          v=$(ls dist/*.tar.gz | sed -E 's/.*-([^-]+)\.tar\.gz$//')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/dwdpheno/$v/json")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$code" = 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "dwdpheno $v is already on PyPI - nothing to upload" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.exists != 'true'
