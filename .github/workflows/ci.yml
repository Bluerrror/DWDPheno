name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}${{ matrix.deps == 'oldest' && ' / oldest deps' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        exclude:
          # ubuntu-latest (26.04) has no Python 3.9 build -> run 3.9 on 22.04
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
            deps: latest
          - os: ubuntu-22.04
            python: "3.9"
            deps: oldest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,plot]"
      - name: Pin oldest supported dependencies
        if: matrix.deps == 'oldest'
        run: pip install "pandas==1.5.3" "numpy==1.23.5" "matplotlib==3.5.3"
      - name: Test
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the wheel ships the reference data
        run: python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert {'dwdpheno/data/regions.txt','dwdpheno/data/cities.txt','dwdpheno/data/counties.geojson','dwdpheno/data/states.geojson'} <= set(n), n"
